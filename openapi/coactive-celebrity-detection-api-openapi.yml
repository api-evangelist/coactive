openapi: 3.2.0
info:
  title: Reference Celebrity Detection API
  version: 1.0.0
servers:
- url: https://api.coactive.ai
  description: Production
- url: https://app.coactive.ai
  description: Production
tags:
- name: celebrity-detection
paths:
  /api/v0/celebrity-detection/person/{person_id}:
    get:
      operationId: celebrityDetection_get_person_api_v0_celebrity_detection_person__person_id__get
      summary: Get a person by id
      tags:
      - celebrity-detection
      parameters:
      - name: person_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_GetPersonResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v0/celebrity-detection/persons:
    get:
      operationId: celebrityDetection_get_persons_in_org_api_v0_celebrity_detection_persons_get
      summary: Get all enrolled persons in org
      tags:
      - celebrity-detection
      parameters:
      - name: page
        in: query
        description: Page number (1-indexed)
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: sort_field
        in: query
        description: Field to sort by
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: sort_direction
        in: query
        description: Sort direction
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/celebrity-detection_SortDirection'
          - type: 'null'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_GetPersonsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v0/celebrity-detection/faces-with-person:
    get:
      operationId: celebrityDetection_get_faces_with_person_api_v0_celebrity_detection_faces_with_person_get
      summary: Get faces with a person
      tags:
      - celebrity-detection
      parameters:
      - name: person_id
        in: query
        description: Person ID
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: person_name
        in: query
        description: Person name
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_GetFacesWithPersonResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v0/celebrity-detection/persons/by-names-and-aliases:
    get:
      operationId: celebrityDetection_get_persons_by_names_and_aliases_api_v0_celebrity_detection_persons_by_names_and_aliases_get
      summary: Get person IDs from a list of names or aliases
      tags:
      - celebrity-detection
      parameters:
      - name: person_names_or_aliases
        in: query
        description: List of person names or aliases to search for
        required: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_GetPersonsByNamesAliasesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v0/celebrity-detection/persons-in-image/{image_id}:
    get:
      operationId: celebrityDetection_get_persons_in_image_api_v0_celebrity_detection_persons_in_image__image_id__get
      summary: Get persons in an image
      tags:
      - celebrity-detection
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_GetPersonsInImageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v0/celebrity-detection/identify:
    get:
      operationId: celebrityDetection_identify_celebrities_in_external_image_api_v0_celebrity_detection_identify_get
      summary: Identify celebrities in an external image
      tags:
      - celebrity-detection
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_IdentifyCelebritiesInExternalImageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/celebrity-detection_IdentifyCelebritiesInExternalImageRequest'
      security:
      - HTTPBearer: []
  /api/v0/celebrity-detection/person/aliases:
    put:
      operationId: celebrityDetection_update_person_aliases_api_v0_celebrity_detection_person_aliases_put
      summary: Update person aliases
      tags:
      - celebrity-detection
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_GetPersonResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/celebrity-detection_HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/celebrity-detection_UpdatePersonAliasesRequest'
      security:
      - HTTPBearer: []
components:
  schemas:
    celebrity-detection_GetPersonResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Person ID
        name:
          type: string
          description: Person name
        aliases:
          type: array
          items:
            type: string
          description: Person aliases
        upload_ids:
          type: array
          items:
            type: string
          description: Upload IDs of the person's images
        ingested_images:
          type: array
          items:
            $ref: '#/components/schemas/celebrity-detection_IngestedImage'
          description: Ingested images of the person
        status:
          $ref: '#/components/schemas/celebrity-detection_EnrollmentStatus'
          description: Person status
        created_user_id:
          type: string
          description: User ID who created the person
        created_dt:
          type: string
          format: date-time
          description: Date and time the person was created
      required:
      - id
      - name
      - aliases
      - upload_ids
      - ingested_images
      - status
      - created_user_id
      - created_dt
      title: GetPersonResponse
    celebrity-detection_EnrollmentStatus:
      type: string
      enum:
      - draft
      - active
      - failed
      - in_progress
      title: EnrollmentStatus
    celebrity-detection_PagedMetaResponse:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/celebrity-detection_PagedPageDetailsResponse'
          description: Details about pagination
        has_next_page:
          type: boolean
          default: false
          description: Whether another page exists
      required:
      - page
      description: Metadata about the paginated response.
      title: PagedMetaResponse
    celebrity-detection_GetPersonsByNamesAliasesResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/celebrity-detection_PersonNameMatch'
          description: List of name to person_id mappings
      required:
      - matches
      title: GetPersonsByNamesAliasesResponse
    celebrity-detection_Face:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Face ID
        image_id:
          type: string
          format: uuid
          description: Asset ID (image_id or keyframe_id)
        dataset_id:
          type: string
          format: uuid
          description: Dataset ID
        bbox:
          $ref: '#/components/schemas/celebrity-detection_BoundingBox'
          description: Relative bounding box coordinates (x1, y1, x2, y2)
        confidence:
          type: number
          format: double
          description: Confidence score of the face identification
      required:
      - id
      - image_id
      - dataset_id
      - bbox
      - confidence
      title: Face
    celebrity-detection_ValidationError:
      type: object
      properties:
        loc:
          type: array
          items:
            $ref: '#/components/schemas/celebrity-detection_ValidationErrorLocItems'
        msg:
          type: string
        type:
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
    celebrity-detection_BoundingBox:
      type: object
      properties:
        x1:
          type: number
          format: double
        y1:
          type: number
          format: double
        x2:
          type: number
          format: double
        y2:
          type: number
          format: double
      required:
      - x1
      - y1
      - x2
      - y2
      title: BoundingBox
    celebrity-detection_GetPersonsInImageResponse:
      type: object
      properties:
        persons:
          type: array
          items:
            $ref: '#/components/schemas/celebrity-detection_Person'
          description: List of persons identified in the image
      required:
      - persons
      title: GetPersonsInImageResponse
    celebrity-detection_SortField:
      type: object
      properties:
        field:
          type: string
          description: Field name to sort by
        direction:
          $ref: '#/components/schemas/celebrity-detection_SortDirection'
          description: Sort direction
      required:
      - field
      description: Sort field details.
      title: SortField
    celebrity-detection_IngestedImage:
      type: object
      properties:
        coactive_image_id:
          type: string
          format: uuid
        dataset_id:
          type: string
          format: uuid
      required:
      - coactive_image_id
      - dataset_id
      title: IngestedImage
    celebrity-detection_HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/celebrity-detection_ValidationError'
      title: HTTPValidationError
    celebrity-detection_ValidationErrorLocItems:
      oneOf:
      - type: string
      - type: integer
      title: ValidationErrorLocItems
    celebrity-detection_GetFacesWithPersonResponse:
      type: object
      properties:
        faces:
          type: array
          items:
            $ref: '#/components/schemas/celebrity-detection_Face'
          description: List of faces associated with the person (id, image_id, dataset_id, bbox, confidence)
      required:
      - faces
      title: GetFacesWithPersonResponse
    celebrity-detection_SortDirection:
      type: string
      enum:
      - asc
      - desc
      description: Sort direction.
      title: SortDirection
    celebrity-detection_Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Person ID
        name:
          type: string
          description: Person name
        aliases:
          type: array
          items:
            type: string
          description: Person aliases
        bbox:
          $ref: '#/components/schemas/celebrity-detection_BoundingBox'
          description: Relative bounding box coordinates (x1, y1, x2, y2)
      required:
      - id
      - name
      - aliases
      - bbox
      title: Person
    celebrity-detection_UpdatePersonAliasesRequest:
      type: object
      properties:
        person_id:
          type: string
          format: uuid
          description: Person ID
        aliases:
          type: array
          items:
            type: string
          description: Updated list of person aliases
      required:
      - person_id
      title: UpdatePersonAliasesRequest
    celebrity-detection_IdentifyCelebritiesInExternalImageRequest:
      type: object
      properties:
        image:
          type: string
          description: Base64 encoded JPEG image
      required:
      - image
      title: IdentifyCelebritiesInExternalImageRequest
    celebrity-detection_GetPersonsResponse:
      type: object
      properties:
        meta:
          oneOf:
          - $ref: '#/components/schemas/celebrity-detection_PagedMetaResponse'
          - type: 'null'
          description: Metadata for pagination
        data:
          type: array
          items:
            $ref: '#/components/schemas/celebrity-detection_GetPersonResponse'
          description: The paginated data
        sort:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/celebrity-detection_SortField'
          description: Sort details
      required:
      - data
      title: GetPersonsResponse
    celebrity-detection_PagedPageDetailsResponse:
      type: object
      properties:
        page:
          type: integer
          description: Current page number (1-indexed)
        per_page:
          type: integer
          description: Number of items per page
      required:
      - page
      - per_page
      description: Pagination metadata.
      title: PagedPageDetailsResponse
    celebrity-detection_IdentifyCelebritiesInExternalImageResponse:
      type: object
      properties:
        persons:
          type: array
          items:
            $ref: '#/components/schemas/celebrity-detection_Person'
          description: List of persons identified in the image
      required:
      - persons
      title: IdentifyCelebritiesInExternalImageResponse
    celebrity-detection_PersonNameMatch:
      type: object
      properties:
        name:
          type: string
          description: The name or alias that was searched
        person_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The matched person ID, or None if not found
      required:
      - name
      - person_id
      title: PersonNameMatch
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Coactive
  source: https://docs.coactive.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)

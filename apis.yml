aid: coactive
name: Coactive
description: Coactive is a multimodal AI platform that delivers a contextual intelligence layer for modern media, turning unstructured images
  and video into structured, searchable intelligence. The platform ingests visual assets at scale and provides agentic and semantic search, dynamic
  tagging, concept training and classification, celebrity and face detection, video narrative metadata and summarization, ad-segment context studio
  workflows, and analytics that plug into data warehouses and BI tools. Every capability is exposed programmatically through a versioned REST
  API (api.coactive.ai) with an official Python SDK, bearer-token authentication, and a hosted documentation MCP server. Coactive was founded
  to help enterprises search, moderate, understand, and monetize their content libraries for contextual advertising, brand safety, and content
  operations.

notes: >-
  Re-probed 2026-08-13. No genuine .well-known document is published on any Coactive host.
  api.coactive.ai and www.coactive.ai return 404 for every probed path (www serves an explicit
  "Invalid .well-known request" page); docs.coactive.ai returns its Next.js 404 shell; and
  app.coactive.ai is a single-page app that answers 200 with its HTML shell for EVERY path, so all
  four of its 200s are false positives, not documents. There is no security.txt, no OIDC discovery,
  no OAuth authorization-server or protected-resource metadata (consistent with the API using a
  bearer-token exchange at POST /api/v0/login rather than OAuth), no api-catalog, no ai-plugin.json,
  and no A2A agent card at either the canonical or legacy path.
  Because nothing genuine was returned, NO WellKnown, SecurityTxt or AgentCard pointer is emitted —
  a recorded absence is data, not a served surface. The stale WellKnown pointer that had been wired
  into apis.yml against this all-404 probe was removed this round.
